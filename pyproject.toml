[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realbricks"
version = "0.1.0"
description = "Lead-to-offer accelerator starter pipelines for Databricks."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.35.0"]
lakebase = ["psycopg[binary]>=3.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

